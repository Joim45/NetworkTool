<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeLab Topology</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="brand-logo" aria-hidden="true"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7.3 11 16.7 6M7.3 13l9.4 5"/></svg>
      <span>HomeLab Topology</span>
    </div>
    <input id="projectName" class="project-name" type="text" spellcheck="false" title="Nazwa projektu">

    <div class="tb-group">
      <button data-action="new" title="Nowa, pusta topologia">Nowy</button>
      <button data-action="open" title="Wczytaj plik JSON">Otwórz</button>
      <button data-action="save" title="Zapisz jako plik JSON (Ctrl+S)">Zapisz</button>
      <button data-action="sample" title="Wczytaj przykładowy home lab">Przykład</button>
    </div>
    <div class="tb-group">
      <button data-action="undo" id="btnUndo" title="Cofnij (Ctrl+Z)">↶</button>
      <button data-action="redo" id="btnRedo" title="Ponów (Ctrl+Y)">↷</button>
    </div>
    <div class="tb-group">
      <button data-action="connect" id="btnConnect" title="Tryb łączenia: kliknij urządzenie A, potem B (L)">⟷ Połącz</button>
      <button data-action="zone" title="Dodaj strefę (VLAN, pomieszczenie, rack). Gdy zaznaczysz urządzenia – strefa obejmie je.">▭ Strefa</button>
      <button data-action="snap" id="btnSnap" title="Przyciąganie do siatki">⌗ Siatka</button>
    </div>
    <div class="tb-group">
      <button data-action="zoom-out" title="Oddal (-)">−</button>
      <span id="zoomLabel" class="zoom-label">100%</span>
      <button data-action="zoom-in" title="Przybliż (+)">+</button>
      <button data-action="fit" title="Dopasuj widok (F)">Dopasuj</button>
    </div>
    <div class="tb-group">
      <button data-action="export-png" title="Eksport do obrazu PNG">PNG</button>
      <button data-action="export-svg" title="Eksport do grafiki wektorowej SVG">SVG</button>
      <button data-action="export-csv" title="Eksport inwentarza do CSV (Excel)">CSV</button>
    </div>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </header>

  <main class="layout">
    <aside class="palette">
      <div class="pane-title">Urządzenia</div>
      <input id="paletteSearch" class="search" type="search" placeholder="Szukaj urządzenia…">
      <div id="paletteList" class="palette-list"></div>
      <div class="pane-title">Typy połączeń</div>
      <div id="linkLegend" class="legend"></div>
    </aside>

    <section class="canvas-wrap" id="canvasWrap">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
        <defs><style id="svgStyle"></style></defs>
        <g id="viewport">
          <g id="zonesLayer"></g>
          <g id="linksLayer"></g>
          <g id="nodesLayer"></g>
          <g id="overlayLayer"></g>
        </g>
      </svg>
      <div id="emptyHint" class="empty-hint">
        <strong>Pusta topologia</strong>
        <span>Przeciągnij urządzenie z palety po lewej (lub kliknij je), a następnie połącz urządzenia przeciągając z niebieskiego uchwytu.</span>
        <button data-action="sample">Wczytaj przykład</button>
      </div>
      <div id="modeHint" class="mode-hint"></div>
      <div id="statusbar" class="statusbar"></div>
    </section>

    <aside class="sidepanel">
      <div class="tabs">
        <button class="tab active" data-tab="props">Właściwości</button>
        <button class="tab" data-tab="inventory">Inwentarz</button>
      </div>
      <div id="propsPanel" class="tab-body"></div>
      <div id="inventoryPanel" class="tab-body" hidden>
        <input id="invFilter" class="search" type="search" placeholder="Filtruj: nazwa, IP, VLAN, usługa…">
        <div id="invSummary" class="inv-summary"></div>
        <div id="invTable"></div>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/devices.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
